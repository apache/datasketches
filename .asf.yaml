# All configurations could be found here: https://github.com/apache/infrastructure-asfyaml/

github:
  description: A software library of stochastic streaming algorithms, a.k.a. sketches.
  homepage: https://datasketches.apache.org
  labels:
    - algorithms
    - datasketches
  features:
    issues: false
    projects: false
    discussions: true
  enabled_merge_buttons:
    squash: true
    merge: false
    rebase: false
  pull_requests:
    allow_auto_merge: true
    allow_update_branch: true
    del_branch_on_merge: true
  protected_branches:
    main: {}
  rulesets:
    - name: "Default Branch Protection"
      type: branch
      branches:
        includes:
          - "~DEFAULT_BRANCH"
          - "release/*"
          - "rel/*"
        excludes: []
      bypass_teams:
        - root
      restrict_deletion: true
      restrict_force_push: true

notifications:
  commits: commits@datasketches.apache.org
  discussions: dev@datasketches.apache.org
  pullrequests_status: commits@datasketches.apache.org
  pullrequests_comment: commits@datasketches.apache.org
